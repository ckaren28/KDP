# Sveltia CMS — karendettmar.com (engineering site)
#
# Sveltia does not implement Netlify's git-gateway backend, so this talks to
# GitHub directly. One dashboard step is required before /admin will log in:
#
#   Netlify → this site → Access & security → OAuth → Install provider → GitHub
#
# That reuses Netlify's OAuth relay at the default base_url (api.netlify.com),
# which is why no base_url is set below. If the site ever leaves Netlify,
# deploy sveltia-cms-auth on Cloudflare Workers and point base_url at it.
#
# Local editing — no proxy server, and no login:
#   npm run dev, then open http://localhost:4321/admin/ in a Chromium browser
#   (Chrome, Edge, Brave), click "Work with Local Repository" and pick this
#   repo's root folder. Sveltia uses the File System Access API and writes
#   straight to disk, so edits show up as normal working-tree changes for you
#   to review and commit yourself.
#
#   Sveltia explicitly does NOT support decap-server / netlify-cms-proxy-server,
#   and it ignores `local_backend`, which is why that option is not set here.
#   Safari and Firefox lack the File System Access API; they need the GitHub
#   login below instead.
backend:
  name: github
  repo: ckaren28/KDP
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    extension: mdx
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: ["date", "title"]
    # Every field in src/content/config.ts must appear here. Anything missing
    # is dropped from the frontmatter on save. That is how the case-study
    # payload would silently disappear the first time a project was edited.
    fields:
      # ── Identity ──────────────────────────────────────────────
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - label: "Subtitle"
        name: "subtitle"
        widget: "string"
        required: false
        hint: "One line under the title on the work grid."
      - label: "Listed on the work grid"
        name: "listed"
        widget: "boolean"
        default: true
        required: false
        hint: "Turn off to keep the project's page live at /projects/<slug> while removing it from the grid. DevCon uses this, since it is a talk rather than a made thing."
      - label: "Track"
        name: "track"
        widget: "hidden"
        default: "tech"
        hint: "Fashion and textile content lives on the separate fashion-studio site (studio.karendettmar.com), not here."
      - { label: "Tags", name: "tags", widget: "list" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", picker_utc: true }
      - label: "Featured on the landing page"
        name: "featured"
        widget: "boolean"
        default: false
        required: false
        hint: "The project uncovered by pulling a letter on the home page. If more than one is ticked, the most recent wins."
      - { label: "Live URL", name: "live_url", widget: "string", required: false }
      - { label: "GitHub URL", name: "github_url", widget: "string", required: false }
      - label: "Password protected"
        name: "password_protected"
        widget: "boolean"
        default: false
        required: false
        hint: "Off by default, and it should stay off for anything you want seen, because a gated project is invisible to anyone who won't email you for the password. Turn it on only for NDA or not-yet-public work. Needs GATE_PASSWORD set in Netlify."

      # ── Imagery ───────────────────────────────────────────────
      - label: "Cover Image"
        name: "coverImage"
        widget: "string"
        required: false
        hint: "Cloudinary URL used on the Work index card."
      - label: "Hero Image"
        name: "hero_image"
        widget: "string"
        required: false
        hint: "Cloudinary URL for the case study hero. e.g. https://res.cloudinary.com/deqij2maw/image/upload/f_auto,q_auto,w_1600/portfolio/your-folder/image-name"

      # ── Overview tab ──────────────────────────────────────────
      - { label: "Problem statement", name: "problem_statement", widget: "text", required: false }
      - { label: "Who it's for", name: "who_its_for", widget: "text", required: false }
      - { label: "Why I built it", name: "why_i_built_it", widget: "text", required: false }
      - { label: "Scope & constraints", name: "scope_constraints", widget: "text", required: false }

      # ── How it works tab — any one field present renders the tab ──
      - { label: "Architecture diagram", name: "architecture_diagram", widget: "string", required: false, hint: "Cloudinary URL." }
      - label: "Output structure"
        name: "output_structure"
        widget: "list"
        required: false
        label_singular: "Row"
        summary: "{{fields.field}}"
        fields:
          - { label: "Field", name: "field", widget: "string" }
          - { label: "What it solves", name: "what_it_solves", widget: "text" }
      - { label: "Sample output", name: "sample_output", widget: "string", required: false, hint: "Cloudinary URL." }
      - label: "Design decisions"
        name: "design_decisions"
        widget: "list"
        required: false
        label_singular: "Decision"
        summary: "{{fields.title}}"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "text" }

      # ── Try it tab ────────────────────────────────────────────
      - { label: "Live embed URL", name: "live_embed_url", widget: "string", required: false }
      - { label: "Live embed note", name: "live_embed_note", widget: "text", required: false }
      - label: "Put the tool at the top of the page"
        name: "tool_on_top"
        widget: "boolean"
        default: false
        required: false
        hint: "Lifts the tool out of the tabs so it sits under the title, with Overview and How it works below it. Removes the 'Try it' tab."

      # ── Process tab — renders when images are present ─────────
      - label: "Process images"
        name: "process_images"
        widget: "list"
        required: false
        label_singular: "Image"
        summary: "{{fields.caption}}"
        fields:
          - { label: "Image", name: "image", widget: "string", hint: "Cloudinary URL." }
          - { label: "Caption", name: "caption", widget: "text", required: false }

      # ── Results tab — renders when images are present ─────────
      - label: "Results images"
        name: "results_images"
        widget: "list"
        required: false
        label_singular: "Image"
        summary: "{{fields.caption}}"
        fields:
          - { label: "Image", name: "image", widget: "string", hint: "Cloudinary URL." }
          - { label: "Caption", name: "caption", widget: "text", required: false }

      - { label: "Body", name: "body", widget: "markdown" }

  - name: "experience"
    label: "Work Experience"
    folder: "src/content/experience"
    create: true
    extension: mdx
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{company}} — {{headline}}"
    sortable_fields: ["order", "start_date", "company"]
    # Same rule as above: every field in src/content/config.ts must appear here
    # or it is dropped from the frontmatter on save.
    fields:
      # ── The company ───────────────────────────────────────────
      - { label: "Company", name: "company", widget: "string" }
      - label: "Role"
        name: "role"
        widget: "string"
        hint: "Your actual job title. Shown small, beside the dates. The card leads on the work instead, so a title like Developer Advocate does not set the tone."
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Start date", name: "start_date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", picker_utc: true }
      - label: "End date"
        name: "end_date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        picker_utc: true
        required: false
        hint: "Leave empty for your current role, and it renders as Present."

      # ── What the card leads with ──────────────────────────────
      - label: "Headline"
        name: "headline"
        widget: "string"
        hint: "The work, not the title. This is the first thing read, so lead with what you designed or built."
      - label: "Result"
        name: "result"
        widget: "string"
        hint: "The quantified outcome. The number is the headline of the card. You have one for every job, and it does more work than a screenshot."
      - { label: "Summary", name: "summary", widget: "text" }
      - label: "Also did"
        name: "also"
        widget: "list"
        required: false
        label_singular: "Item"
        hint: "Keep this to two, chosen. An exhaustive list reads as a CV bleeding into a portfolio; two picked ones read as judgement."

      # ── Evidence ──────────────────────────────────────────────
      - label: "Artifacts"
        name: "artifacts"
        widget: "list"
        required: false
        label_singular: "Artifact"
        summary: "{{fields.caption}}"
        hint: "Optional on purpose. Internal or NDA'd work has nothing to show, and saying so beats padding the card."
        fields:
          - { label: "Image", name: "image", widget: "string", hint: "Cloudinary URL." }
          - { label: "Caption", name: "caption", widget: "text", required: false }
      - label: "Never shipped"
        name: "unshipped"
        widget: "boolean"
        default: false
        required: false
        hint: "Tick when the work shown was a proposal that did not go live. The card then says so outright. Unshipped work is fine, implying it shipped is not."
      - label: "Internal / under NDA"
        name: "nda"
        widget: "boolean"
        default: false
        required: false
        hint: "Tick when the work can't be shown. The page says so plainly instead of looking like it is missing its images. 'Internal, happy to discuss' reads as discretion to a hiring manager."
      - label: "Compact — one line, no case page"
        name: "compact"
        widget: "boolean"
        default: false
        required: false
        hint: "Drops this role to a single line beneath the cards and builds no case page. Use where there is a real result but nothing to show, so a full card would be padding."
      - { label: "Live URL", name: "live_url", widget: "string", required: false }

      - label: "Order"
        name: "order"
        widget: "number"
        value_type: "int"
        hint: "Ascending. Controls the order of cards independently of dates."

      - { label: "Body", name: "body", widget: "markdown" }
