backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    extension: mdx
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - label: "Track"
        name: "track"
        widget: "hidden"
        default: "tech"
        hint: "Fashion and textile content lives on the separate fashion-studio site (studio.karendettmar.com), not here."
      - { label: "Tags", name: "tags", widget: "list" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Live URL", name: "live_url", widget: "string", required: false }
      - { label: "GitHub URL", name: "github_url", widget: "string", required: false }
      - { label: "Password Protected", name: "password_protected", widget: "boolean", default: false, required: false }
      - label: "Hero Image"
        name: "hero_image"
        widget: "string"
        required: false
        hint: "Cloudinary URL for the case study hero image. e.g. https://res.cloudinary.com/deqij2maw/image/upload/f_auto,q_auto,w_1600/portfolio/your-folder/image-name"
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "illustrations"
    label: "Illustrations"
    folder: "src/content/illustrations"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Tags", name: "tags", widget: "list" }
