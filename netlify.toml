[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."museum-label"]
  timeout = 26

[functions."garment-decoder"]
  timeout = 30

[functions."textile-palette"]
  timeout = 20

# Fashion/textile content moved to studio.karendettmar.com, so redirect old URLs
[[redirects]]
  from = "/studio"
  to = "https://studio.karendettmar.com/"
  status = 301

